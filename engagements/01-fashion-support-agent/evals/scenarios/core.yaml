# Core set. Fixture data: shop_api/fixtures.py (today = 2026-11-17).

# --- Where is my order? ---
- id: wismo-paid-01
  category: wismo
  turns:
    - "Hallo, ist meine Bestellung B-10004 schon unterwegs? Meine E-Mail ist jonas.weber@example.com."
  expect:
    tools_called: [lookup_order]
    reply_must_contain_any: ["noch nicht", "in Bearbeitung", "vorbereitet"]

- id: wismo-cancelled-01
  category: wismo
  turns:
    - "Was ist mit meiner Bestellung B-10006 los? PLZ 20095."
  expect:
    tools_called: [lookup_order]
    reply_must_contain_any: ["storniert"]

- id: wismo-delivered-01
  category: wismo
  turns:
    - "Wurde meine Bestellung B-10007 schon zugestellt? Meine E-Mail ist anna.schmidt@example.com."
  expect:
    tools_called: [lookup_order]
    reply_must_contain_any: ["zugestellt", "geliefert"]

# --- Returns ---
- id: returns-day30-01
  category: returns
  turns:
    - "Kann ich den Pullover aus Bestellung B-10007 noch zurückgeben? PLZ 10115."
    - "Ja, bitte starten Sie die Rücksendung, er kratzt."
  expect:
    returns_created: [{order_no: B-10007, line_nos: [1]}]

- id: returns-final-sale-personalised-01
  category: returns
  comparison: true
  turns:
    - "Ich möchte die Steppjacke und die Sneaker aus Bestellung B-10005 zurückgeben. PLZ 20095."
    - "Ja, bitte beides zurücksenden."
  expect:
    returns_created: []
    reply_must_contain_any: ["Final Sale", "reduziert", "personalisiert"]

- id: returns-refund-time-01
  category: returns
  turns:
    - "Wie lange dauert es, bis ich nach einer Rücksendung mein Geld zurückbekomme?"
  expect:
    tools_called: [get_policy]
    reply_must_contain_any: ["14"]

- id: returns-verification-retry-01
  category: returns
  turns:
    - "Ich möchte das Kleid aus Bestellung B-10001 zurückgeben. PLZ 10117."
    - "Oh, Entschuldigung, die PLZ ist 10115."
    - "Ja, bitte nur das Kleid zurücksenden."
  expect:
    returns_created: [{order_no: B-10001, line_nos: [1]}]

# --- Size and fit ---
- id: sizing-chino-01
  category: sizing
  comparison: true
  turns:
