  expect:
    tools_called: [recommend_size]
    reply_must_contain_any: ["W32", "W34"]

- id: sizing-shoes-01
  category: sizing
  turns:
    - "Meine Füße sind 25,4 cm lang. Welche Größe empfehlen Sie bei den Sneakern mit Monogramm?"
  expect:
    tools_called: [recommend_size]
    reply_must_contain_any: ["40", "41"]

